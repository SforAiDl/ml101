<script type="text/markdown" id="markdown">
A neural network has millions of adjustable numbers called weights. Think of them as knobs. The loss is a single number that measures how wrong the network is, and training means turning the knobs until the loss is small.

Whether that works comes down to four things: how we turn the knobs, where they start, how we stop the network memorizing, and a trick called dropout.

## Part 1: Optimization {toc: Optimization}

### The loss

Start with the smallest model there is: a line through some dots, with one knob that sets its slope.

<div class="tp" id="fx-knob">
<svg id="fx-knob-svg" viewBox="0 0 640 290" role="img" aria-label="A line through dots, and its loss for each slope"></svg>
<div class="tp-cap"></div>
<div class="tp-ctl"><button type="button" data-act="play">Play</button><button type="button" data-act="prev">&larr; Back</button><button type="button" data-act="next">Next &rarr;</button><button type="button" data-act="reset">Restart</button><span class="tp-count"></span></div>
</div>
<p class="figcap">Red: how far the line misses each dot. The loss adds up these misses, squared so that big misses count more.</p>

Every slope has a loss, and together they trace a curve. The best slope is at its lowest point.

### The loss landscape

Add a second knob, the intercept, which moves the line up and down. Now every pair of settings has a loss, and we can draw it as a surface.

<div class="tp" id="fx-surf">
<canvas class="fx" id="fx-surf-canvas" role="img" aria-label="The loss for every slope and intercept, drawn as a surface, then seen from above"></canvas>
<div class="tp-cap"></div>
<div class="tp-ctl"><button type="button" data-act="play">Play</button><button type="button" data-act="prev">&larr; Back</button><button type="button" data-act="next">Next &rarr;</button><button type="button" data-act="reset">Restart</button><span class="tp-count"></span></div>
</div>
<p class="figcap">Blue is low loss, pale is high.</p>

Seen from above it becomes a contour map, and that is the picture we will use from here on. A real network has millions of knobs, so we only ever draw two at a time.

### Gradient descent

For a real network we never get to see this map. What we can compute is the slope of the ground where we are standing, so training is like walking downhill in fog.

<div class="tp wide" id="fx-train">
<div class="tp-grid">
<div class="tp-left">
<canvas class="fx" id="fx-train-canvas" role="img" aria-label="Loss landscape with a ball walking downhill"></canvas>
<div class="tp-cap"></div>
<div class="tp-ctl"><button type="button" data-act="play">Play</button><button type="button" data-act="prev">&larr; Back</button><button type="button" data-act="next">Next &rarr;</button><button type="button" data-act="reset">Restart</button><span class="tp-count"></span></div>
</div>
<div class="tp-right">
<div class="codebox" id="fx-train-code">
<div class="codebox-title">Gradient descent</div>
<div class="cl" data-k="init">w = random_start()              <span class="cm"># drop the ball</span></div>
<div class="cl" data-k="for">for step in range(6):</div>
<div class="cl" data-k="loss">    loss = loss_fn(w, all_data)  <span class="cm"># 1. measure</span></div>
<div class="cl" data-k="back">    slope = gradient(loss, w)    <span class="cm"># 2. slope</span></div>
<div class="cl" data-k="step">    w = w - lr * slope           <span class="cm"># 3. step</span></div>
</div>
</div>
</div>
</div>

$$\text{new weights} = \text{old weights} - \text{step size} \times \text{slope}$$

This is gradient descent. The step size is called the learning rate.

Every optimizer that follows is gradient descent with one idea added:

<div class="lineage" data-at="gd"></div>

### The learning rate

<div class="tp" id="fx-lr">
<div class="chips" data-group="lr"><button type="button" class="chip" data-v="0.02">Too small</button><button type="button" class="chip" data-v="0.3" aria-pressed="true">Just right</button><button type="button" class="chip" data-v="0.9">Too big</button><button type="button" class="chip" data-v="1.04">Way too big</button></div>
<svg id="fx-lr-svg" viewBox="0 0 640 290" role="img" aria-label="A ball stepping down a bowl"></svg>
<div class="tp-cap"></div>
<div class="tp-ctl"><button type="button" data-act="play">Play</button><button type="button" data-act="prev">&larr; Back</button><button type="button" data-act="next">Next &rarr;</button><button type="button" data-act="reset">Restart</button><span class="tp-count"></span></div>
</div>

Too small and training crawls; too large and it bounces around or blows up. In practice the learning rate is also lowered as training goes on.

### Stochastic gradient descent

<div class="lineage" data-at="sgd"></div>

The exact slope needs every training example, which is slow. SGD estimates it from a small random batch instead: a little off each time, but cheap enough to take many more steps.

<div class="tp wide" id="fx-sgd">
<div class="chips" data-group="batch"><span>Examples per step:</span><button type="button" class="chip" data-v="1">1</button><button type="button" class="chip" data-v="8" aria-pressed="true">8</button><button type="button" class="chip" data-v="32">32</button><button type="button" class="chip" data-v="200">all 200</button></div>
<div class="tp-grid">
<div class="tp-left">
<div class="fx-row">
<div><svg id="fx-sgd-data" viewBox="0 0 300 240" role="img" aria-label="Training examples, the chosen few, and the current line"></svg><p class="fx-sub">The data, and our line</p></div>
<div><canvas class="fx" id="fx-sgd-canvas" role="img" aria-label="The loss map for every possible line"></canvas><p class="fx-sub">The loss map</p></div>
</div>
<div class="tp-cap"></div>
<div class="tp-ctl"><button type="button" data-act="play">Play</button><button type="button" data-act="prev">&larr; Back</button><button type="button" data-act="next">Next &rarr;</button><button type="button" data-act="reset">Restart</button><span class="tp-count"></span></div>
</div>
<div class="tp-right">
<div class="codebox" id="fx-sgd-code">
<div class="codebox-title">SGD = GD + a few examples</div>
<div class="cl" data-k="init">w = random_start()</div>
<div class="cl" data-k="for">for step in range(10):</div>
<div class="cl add" data-k="loader">    batch = random_pick(all_data, <span id="fx-sgd-bs">8</span>)</div>
<div class="cl" data-k="loss">    loss = loss_fn(w, <span class="chg">batch</span>)</div>
<div class="cl" data-k="back">    slope = gradient(loss, w)</div>
<div class="cl" data-k="step">    w = w - lr * slope</div>
<div class="codebox-note"><b class="plus">+</b> new &nbsp; <span class="chg">underlined</span>: changed</div>
</div>
</div>
</div>
</div>
<p class="figcap">Orange: the examples used in this step.</p>

### Why SGD zigzags

In a narrow valley the slope points mostly at the walls rather than along the floor, so SGD bounces from side to side.

<div class="tp wide" id="fx-w-sgd">
<div class="tp-grid">
<div class="tp-left">
<canvas class="fx" role="img" aria-label="Plain SGD zigzagging down a narrow valley"></canvas>
<div class="tp-cap"></div>
<div class="tp-ctl"><button type="button" data-act="play">Play</button><button type="button" data-act="prev">&larr; Back</button><button type="button" data-act="next">Next &rarr;</button><button type="button" data-act="reset">Restart</button><span class="tp-count"></span></div>
</div>
<div class="tp-right">
<div class="codebox">
<div class="codebox-title">SGD: one step</div>
<div class="cl" data-k="slope">slope = gradient(loss, w)</div>
<div class="cl" data-k="w">w = w - lr * slope</div>
</div>
</div>
</div>
</div>

### Momentum

<div class="lineage" data-at="mom"></div>

Momentum keeps a running velocity, the way a heavy ball keeps rolling. Pushes that flip back and forth cancel out; pushes along the floor add up.

<div class="tp wide" id="fx-w-mom">
<div class="tp-grid">
<div class="tp-left">
<canvas class="fx" role="img" aria-label="Momentum rolling down a narrow valley"></canvas>
<div class="tp-cap"></div>
<div class="tp-ctl"><button type="button" data-act="play">Play</button><button type="button" data-act="prev">&larr; Back</button><button type="button" data-act="next">Next &rarr;</button><button type="button" data-act="reset">Restart</button><span class="tp-count"></span></div>
</div>
<div class="tp-right">
<div class="codebox">
<div class="codebox-title">Momentum = SGD + speed</div>
<div class="cl" data-k="slope">slope = gradient(loss, w)</div>
<div class="cl add" data-k="speed">speed = 0.9 * speed + slope</div>
<div class="cl" data-k="w">w = w - lr * <span class="chg">speed</span></div>
<div class="codebox-note"><b class="plus">+</b> new &nbsp; <span class="chg">underlined</span>: changed</div>
</div>
</div>
</div>
</div>
<p class="figcap">Gray: plain SGD with the same step size.</p>

### Nesterov momentum

<div class="lineage" data-at="nag"></div>

Nesterov momentum looks before it leaps. It measures the slope where the momentum is about to carry it, not where it stands, so it starts braking before it overshoots.

<div class="tp wide" id="fx-w-nag">
<div class="tp-grid">

It swings far less than plain momentum.

### AdaGrad

<div class="lineage" data-at="ada"></div>

AdaGrad gives each direction its own step size. It divides each part of the slope by the total size of all its past slopes, so steep directions get small steps and flat ones get big steps.

<div class="tp wide" id="fx-w-ada">
<div class="tp-grid">
<div class="tp-left">
<canvas class="fx" role="img" aria-label="AdaGrad walking along a narrow valley"></canvas>
<div class="tp-cap"></div>
<div class="tp-ctl"><button type="button" data-act="play">Play</button><button type="button" data-act="prev">&larr; Back</button><button type="button" data-act="next">Next &rarr;</button><button type="button" data-act="reset">Restart</button><span class="tp-count"></span></div>
</div>
<div class="tp-right">
<div class="codebox">
<div class="codebox-title">AdaGrad = SGD + own step sizes</div>
<div class="cl" data-k="slope">slope = gradient(loss, w)</div>
<div class="cl add" data-k="size">size = size + slope**2</div>
<div class="cl" data-k="w">w = w - lr * slope <span class="chg">/ sqrt(size)</span></div>
<div class="codebox-note"><b class="plus">+</b> new &nbsp; <span class="chg">underlined</span>: changed</div>
</div>
</div>
</div>
</div>
<p class="figcap">Gray: plain SGD.</p>

The totals only ever grow, so every step is a little shorter than the last. Over a long training run, AdaGrad can slow to a crawl.

### RMSProp

<div class="lineage" data-at="rms"></div>

RMSProp lets old slopes fade from the record, so it tracks how steep each direction has been lately. The steps no longer shrink just because time has passed.

<div class="tp wide" id="fx-w-rms">
<div class="tp-grid">
<div class="tp-left">
<canvas class="fx" role="img" aria-label="RMSProp walking along a narrow valley"></canvas>
<div class="tp-cap"></div>

</div>
<div class="tp-right">
<div class="codebox">
<div class="codebox-title">RMSProp = AdaGrad + forgetting</div>
<div class="cl" data-k="slope">slope = gradient(loss, w)</div>
<div class="cl" data-k="size">size = <span class="chg">0.9 *</span> size + <span class="chg">0.1 *</span> slope**2</div>
<div class="cl" data-k="w">w = w - lr * slope / sqrt(size)</div>
<div class="codebox-note"><b class="plus">+</b> new &nbsp; <span class="chg">underlined</span>: changed</div>
</div>
</div>
</div>
</div>
<p class="figcap">Gray: plain SGD.</p>

### Adam

<div class="lineage" data-at="adam"></div>

Adam combines the two, momentum's velocity with RMSProp's per-direction step sizes. It is the usual first choice.

No optimizer wins on every landscape. Switching between them in PyTorch is a one-line change:

```python
torch.optim.SGD(params, lr=0.1)
torch.optim.SGD(params, lr=0.1, momentum=0.9)
torch.optim.RMSprop(params, lr=0.001)
torch.optim.Adam(params, lr=0.001)
```

## Part 2: Initialization {toc: Initialization}

Before training, every weight needs a value. Two things matter: the values should differ from each other, and they should be the right size.

### Why the start must be random

Two neurons that start with the same weights compute the same thing, get the same slope and receive the same update, so they stay identical forever.

Below, the same small network is trained twice: once with every neuron starting the same, once with random starts.

<div class="tp" id="fx-sym">
<svg id="fx-sym-svg" viewBox="0 0 640 332" role="img" aria-label="The same small network trained from an identical start and from a random start, one step at a time"></svg>
<div class="tp-cap"></div>
<div class="tp-ctl"><button type="button" data-act="play">Play</button><button type="button" data-act="prev">&larr; Back</button><button type="button" data-act="next">Next &rarr;</button><button type="button" data-act="reset">Restart</button><span class="tp-count"></span></div>
</div>
<p class="figcap">Line thickness: how big each weight is (dashed: negative). Numbers in the circles: each neuron's output for one dot. Red: slopes.</p>

### How big the starting weights should be

Each layer scales the signal by roughly the same factor, and the size of the weights sets that factor. Over many layers it compounds.

<div class="tp" id="fx-tel">
<div class="chips" data-group="spread"><span>Starting weights:</span><button type="button" class="chip" data-v="0.5" aria-pressed="true">Too small</button><button type="button" class="chip" data-v="1">Just right</button><button type="button" class="chip" data-v="2">Too big</button></div>
<svg id="fx-tel-svg" viewBox="0 0 640 250" role="img" aria-label="A ten-layer network lighting up as the signal passes through it"></svg>
<div class="tp-cap"></div>
<div class="tp-ctl"><button type="button" data-act="play">Play</button><button type="button" data-act="prev">&larr; Back</button><button type="button" data-act="next">Next &rarr;</button><button type="button" data-act="reset">Restart</button><span class="tp-count"></span></div>
</div>
<p class="figcap">The glow shows how strong the signal is at each layer.</p>

The slopes travelling back through the network shrink or blow up in the same way, and training stalls.

### He initialization and BatchNorm

A neuron sums all of its inputs, so more inputs give a larger sum. Neurons with more inputs therefore get smaller starting weights:

$$\text{spread} = \sqrt{\frac{2}{\text{number of inputs}}}$$

This is He initialization. BatchNorm takes a different route: it rescales the signal after every layer, so the starting size matters much less.

## Part 3: Regularization {toc: Regularization}

### Overfitting

A model can fit its training data perfectly and still fail on anything new. This is called overfitting.

<div class="tp" id="fx-fit">
<svg id="fx-fit-svg" viewBox="0 0 640 300" role="img" aria-label="Curves of different bendiness fitted to ten points"></svg>
<div class="tp-cap"></div>
<div class="tp-ctl"><button type="button" data-act="play">Play</button><button type="button" data-act="prev">&larr; Back</button><button type="button" data-act="next">Next &rarr;</button><button type="button" data-act="reset">Restart</button><span class="tp-count"></span></div>
</div>
<p class="figcap">Filled dots: training data. Hollow dots: new data the curve never saw.</p>

### Penalizing complicated models

One fix is to add a penalty to the loss, with a dial λ for how much it counts:

$$\text{total loss} = \text{how wrong} + \lambda \times \text{how complicated}$$

Here is the overfitting curve again as the dial goes up:

<div class="tp" id="fx-pen">
<svg id="fx-pen-svg" viewBox="0 0 640 300" role="img" aria-label="The same bendy curve as the penalty dial turns up"></svg>
<div class="tp-cap"></div>
<div class="tp-ctl"><button type="button" data-act="play">Play</button><button type="button" data-act="prev">&larr; Back</button><button type="button" data-act="next">Next &rarr;</button><button type="button" data-act="reset">Restart</button><span class="tp-count"></span></div>
</div>

The common choice, L2 or weight decay, shrinks all weights a little. L1 pushes useless weights to exactly zero.

### Data augmentation

A flipped or cropped photo of a cat is still a cat, so every training image can be reused in many altered versions.

<div class="tp wide" id="fx-aug">
<div class="tp-grid">
<div class="tp-left">
<svg id="fx-aug-svg" viewBox="0 0 520 286" role="img" aria-label="A cat picture and six altered versions of it"></svg>
<div class="tp-cap"></div>

</div>

<div class="cl" data-k="end">])</div>
</div>
</div>
</div>
</div>

The network then learns what cats look like, rather than memorizing particular photos.

## Part 4: Dropout {toc: Dropout}

### Switching neurons off

During training, dropout switches off a random set of neurons at every step. No neuron can count on the others being there, so what the network knows gets spread out.

<div class="tp wide" id="fx-drop">
<div class="chips" data-group="p"><span>Chance a neuron sits out:</span><button type="button" class="chip" data-v="0.2">0.2</button><button type="button" class="chip" data-v="0.5" aria-pressed="true">0.5</button><button type="button" class="chip" data-v="0.7">0.7</button></div>
<div class="tp-grid">
<div class="tp-left">
<svg id="fx-drop-svg" viewBox="0 0 560 300" role="img" aria-label="A network with randomly switched-off neurons"></svg>
<div class="tp-cap"></div>

</div>
<div class="tp-right">
<div class="codebox" id="fx-drop-code">
<div class="codebox-title">Dropout</div>
<div class="cl" data-k="model">model = nn.Sequential(</div>
<div class="cl" data-k="model">    nn.Linear(4, 6), nn.ReLU(), nn.Dropout(<span class="fx-p">0.5</span>),</div>
<div class="cl" data-k="model">    nn.Linear(6, 6), nn.ReLU(), nn.Dropout(<span class="fx-p">0.5</span>),</div>

</div>
</div>

At test time every neuron is on, which would make the signal stronger than in training. PyTorch already scales for this, so all you need is `model.eval()`.

      var svg = document.getElementById("fx-doc-svg"); if (!svg) { return; }
      var PANELS = [
        { t: "Shoots up", fix: "Learning rate too high: lower it", tr: function (x) { return x < 0.25 ? 1 - x : 0.75 + Math.pow((x - 0.25) * 2.4, 2.2); } },
        { t: "Barely moves", fix: "Learning rate too low: raise it", tr: function (x) { return 1 - 0.12 * x; } },
        { t: "Orange turns up", fix: "Overfitting: regularize, or get more data", tr: function (x) { return 0.95 * Math.exp(-3.2 * x) + 0.05; }, va: function (x) { return 0.95 * Math.exp(-3.2 * x) + 0.2 + 0.55 * Math.max(0, x - 0.4) * Math.max(0, x - 0.4) * 3; } },
        { t: "Both stay high", fix: "Too simple: bigger model, or train longer", tr: function (x) { return 0.55 + 0.45 * Math.exp(-5 * x); }, va: function (x) { return 0.6 + 0.42 * Math.exp(-5 * x); } }
      ];
      function draw() {
        clear(svg); var faint = css("--fg-faint");
        PANELS.forEach(function (pn, k) {
          var ox = 20 + (k % 2) * 315, oy = 12 + Math.floor(k / 2) * 185, w = 280, h = 110;
          T(ox, oy + 16, pn.t, { "font-size": 17, "font-weight": 700, fill: css("--fg-strong") }, svg);
          S("line", { x1: ox, x2: ox + w, y1: oy + 30 + h, y2: oy + 30 + h, stroke: css("--border") }, svg);
          S("line", { x1: ox, x2: ox, y1: oy + 28, y2: oy + 30 + h, stroke: css("--border") }, svg);
          function curve(f, col) { var d = ""; for (var x = 0; x <= 1.0001; x += 0.02) { var v = f(x); if (v > 1.25) { d += "L" + (ox + x * w).toFixed(1) + "," + (oy + 30).toFixed(1); break; } d += (d ? "L" : "M") + (ox + x * w).toFixed(1) + "," + (oy + 30 + h - v / 1.25 * h).toFixed(1); } S("path", { d: d, fill: "none", stroke: col, "stroke-width": 2.8 }, svg); }
          curve(pn.tr, css("--c-blue")); if (pn.va) { curve(pn.va, css("--c-orange")); }
          T(ox + w, oy + 30 + h + 15, "time →", { "text-anchor": "end", "font-size": 12, fill: faint }, svg);
          T(ox, oy + 30 + h + 36, pn.fix, { "font-size": 15, fill: css("--fg-mid") }, svg);
        });
      }
      draw(); onTheme(draw);
    })();
  };
  </script>
  <script>
    (function () {
      var b = document.getElementById("themetoggle"); if (!b) { return; }
      b.addEventListener("click", function () {
        var dark = document.documentElement.getAttribute("data-theme") === "dark";
        if (dark) { document.documentElement.removeAttribute("data-theme"); } else { document.documentElement.setAttribute("data-theme", "dark"); }
        try { localStorage.setItem("hnnl-theme", dark ? "light" : "dark"); } catch (e) {}
        window.dispatchEvent(new Event("themechange"));
      });
    })();
  </script>
